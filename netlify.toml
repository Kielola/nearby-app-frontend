# Netlify configuration — commit this to the FRONTEND repo root.
#
# Netlify reads this automatically. It replaces the two things you would
# otherwise type into the dashboard, and adds the SPA redirect that is the
# difference between "deep links work" and "every refresh is a 404".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the backend. Node 22 is what the frontend declares in engines
  # (">=22") and what Netlify's default image provides.
  NODE_VERSION = "22"

  # ───────────────────────────────────────────────────────────────────────────
  # SECRETS SCANNING — two public values exempted by name
  #
  # Netlify compares every configured environment-variable VALUE against the raw
  # text of the repo and the build output, comments included. Two of those values
  # are VITE_FIREBASE_PROJECT_ID and VITE_FIREBASE_AUTH_DOMAIN, and this file has
  # to state the Firebase hostname literally for the /__/auth proxy below to work
  # at all — redirect targets in netlify.toml cannot be filled in from a variable.
  #
  # Both values are public by design. The Firebase web config is designed to ship
  # inside a browser bundle; it is the same config every visitor's browser
  # downloads, and knowing the project id grants nothing on its own. Authorisation
  # is enforced by Firestore rules and by the backend's token check, not by
  # keeping this config secret.
  #
  # The backend's real secrets — FIREBASE_PRIVATE_KEY, DATABASE_URL — live on
  # Render and are not in this repository, so this exemption cannot affect them.
  #
  # This is the remedy Netlify's own failure message names, and it is deliberately
  # narrower than the alternatives: scanning stays ON and keeps watching every
  # other key and every other file, including the built assets.
  #
  # If a build ever fails again naming a different key, add that key here. Never
  # set SECRETS_SCAN_ENABLED = "false" — that would blind the check for genuine
  # credentials too.
  # ───────────────────────────────────────────────────────────────────────────
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID"

# ─────────────────────────────────────────────────────────────────────────────
# FIREBASE AUTH HANDLER PROXY — needed only once you switch the auth domain
#
# Firebase serves its sign-in helper (and the password-reset action page) from
# https://<project>.firebaseapp.com/__/auth/*. Left alone, that is why Google
# sign-in shows "to continue to <project>.firebaseapp.com" and why password
# reset links point at firebaseapp.com.
#
# The way to own that domain without moving your hosting to Firebase is to proxy
# these paths to Firebase transparently. SETTING VITE_FIREBASE_AUTH_DOMAIN to
# nearby.fashfos.com then makes the popup, the consent screen and the reset link
# all show your domain.
#
# status = 200 is a PROXY, not a redirect — it must be transparent, exactly as
# Firebase's own guidance specifies ("this cannot be done via a 302 Redirect").
#
# This is additive and safe to deploy now: it only affects paths beginning
# /__/auth/, which today would fall through to the SPA rewrite below and return
# index.html (i.e. be broken anyway). Nothing else changes until you switch the
# auth domain variable.
#
# It MUST come before the SPA catch-all below, since rules apply in order.
#
# Before switching, do the two console steps in the handover notes:
#   1. Firebase → Authentication → Settings → Authorized domains: add nearby.fashfos.com
#   2. Google Cloud → APIs & Services → Credentials → the "Web client (auto created
#      by Google Service)" → Authorized redirect URIs: add
#      https://nearby.fashfos.com/__/auth/handler
#
# If sign-in ever breaks after the switch, change VITE_FIREBASE_AUTH_DOMAIN
# back to your <project>.firebaseapp.com value and redeploy — instant rollback.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/__/auth/*"
  to = "https://nearby-socials.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# SPA FALLBACK — REQUIRED
#
# The app is a single-page app: React Router handles /chat, /profile and so on
# in the browser. A real HTTP request for those paths does not exist on disk, so
# without this rule Netlify returns 404 for every deep link and every refresh
# that is not on "/".
#
# status = 200 (not 301) is deliberate: it rewrites rather than redirects, so the
# URL stays as the user typed it.
#
# This rule must come LAST — Netlify applies redirects in order.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames change on every build, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must NOT be cached, or a redeploy serves the old app to anyone
# with a warm browser cache — the classic "my fix didn't go live" bug.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
